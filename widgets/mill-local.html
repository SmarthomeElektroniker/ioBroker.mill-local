<!--
    ioBroker.mill-local - widgets for vis 1.x (set "mill-local")

    Every widget needs only the device object (mill-local.<n>.<mac>); the overview widgets take up to eight.
    Colour scheme: automatic (browser setting), light or dark. Ready-made views: vis-templates/ in the repository.
-->
<link
    rel="stylesheet"
    type="text/css"
    href="widgets/mill-local/css/mill-local.css"
/>
<script
    type="text/javascript"
    src="widgets/mill-local/js/mill-local-i18n.js"
></script>
<script
    type="text/javascript"
    src="widgets/mill-local/js/mill-local.js"
></script>

<script
    id="tplMillPage"
    type="text/ejs"
    class="vis-tpl"
    data-vis-set="mill-local"
    data-vis-type="static"
    data-vis-name="Page background and title"
    data-vis-attrs="title;subtitle;detailView/views;theme/select,auto,light,dark"
>
    <div id="<%= this.data.attr('wid') %>" class="vis-widget <%== this.data.attr('class') %>" style="width:1280px;height:800px">
        <% vis.binds['mill-local'].page(this.data.wid, this.view, this.data); %>
    </div>
</script>
